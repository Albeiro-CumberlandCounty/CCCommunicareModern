name: Publish review preview to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Astro project
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Rewrite generated pages for review URL
        run: node scripts/prepare-pages-preview.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
